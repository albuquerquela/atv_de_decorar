{% extends 'base.html' %}

{% block title %}Nova Tarefa{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title mb-4"><i class="bi bi-file-earmark-plus me-2"></i>Nova Tarefa</h3>
                
                <form method="POST" action="{{ url_for('nova_tarefa') }}">
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">Título</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ex: Estudar Bootstrap" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="descricao" class="form-label fw-semibold">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="4" placeholder="Detalhes da tarefa..."></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
