{% extends 'base.html' %}

{% block title %}Criar Conta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4"><i class="bi bi-person-plus me-2"></i>Criar Conta</h3>
                
                <form method="POST" action="{{ url_for('registro') }}">
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="senha" class="form-label fw-semibold">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 mb-3">Cadastrar</button>
                </form>
                
                <div class="text-center">
                    <small>Já tem uma conta? <a href="{{ url_for('login') }}">Faça Login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
